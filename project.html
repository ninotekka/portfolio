<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project, Ninotekka</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">

  <header>
    <nav aria-label="Navigation principale">
      <a href="projects.html" aria-current="page">Projects</a>
      <a href="index.html#about">About me</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="sub">
    <article class="pdetail" id="project"></article>
    <noscript><p>Activez JavaScript pour afficher ce projet.</p></noscript>
  </main>

  <footer><a href="index.html">© 2026 Ninotekka</a></footer>

</div>

<!-- Le contenu de chaque projet se modifie dans le fichier projects.js -->
<script src="projects.js"></script>
<script>
  var root = document.getElementById('project');
  var id = new URLSearchParams(location.search).get('id');
  var index = PROJECTS.findIndex(function (p) { return p.id === id; });

  function el(tag, className, text) {
    var e = document.createElement(tag);
    if (className) e.className = className;
    if (text) e.textContent = text;
    return e;
  }

  if (index === -1) {
    document.title = 'Projet introuvable, Ninotekka';
    root.appendChild(el('h1', '', 'Project not found'));
    var back = el('p');
    var link = el('a', '', '← Back to projects');
    link.href = 'projects.html';
    back.appendChild(link);
    root.appendChild(back);
  } else {
    var p = PROJECTS[index];
    document.title = p.title + ', Ninotekka';

    root.appendChild(el('h1', '', p.title));

    var meta = [p.category, p.year].filter(Boolean).join(', ');
    if (meta) root.appendChild(el('p', 'pmeta', meta));
    if (p.description) root.appendChild(el('p', 'pdesc', p.description));

    var gallery = el('div', 'pimages');
    (p.images || []).forEach(function (item) {
      var src = typeof item === 'string' ? item : item.src;
      var caption = typeof item === 'string' ? '' : item.caption;

      var fig = el('figure');
      var img = document.createElement('img');
      img.src = src;
      img.alt = caption || p.title;
      img.loading = 'lazy';
      img.onerror = function () { fig.remove(); }; /* image introuvable : on la retire */
      fig.appendChild(img);
      if (caption) fig.appendChild(el('figcaption', '', caption));
      gallery.appendChild(fig);
    });
    root.appendChild(gallery);

    /* Navigation en bas de page */
    var nav = el('nav', 'pnav');
    nav.setAttribute('aria-label', 'Navigation entre les projets');
    var all = el('a', '', '← All projects');
    all.href = 'projects.html';
    var next = PROJECTS[(index + 1) % PROJECTS.length];
    var nextLink = el('a', '', 'Next project →');
    nextLink.href = 'project.html?id=' + encodeURIComponent(next.id);
    nav.appendChild(all);
    nav.appendChild(nextLink);
    root.parentNode.insertBefore(nav, root.nextSibling);
  }
</script>
</body>
</html>
