<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects, Ninotekka</title>
<meta name="description" content="Projets de Ninotekka, graphiste indépendant.">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="wrap">

  <header>
    <nav aria-label="Navigation principale">
      <a href="projects.html" aria-current="page">Projects</a>
      <a href="index.html#about">About me</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="sub">
    <ol class="plist" id="plist"></ol>
    <noscript><p>Activez JavaScript pour afficher les projets.</p></noscript>
  </main>

  <footer><a href="index.html">© 2026 Ninotekka</a></footer>

</div>

<!-- La liste des projets se modifie dans le fichier projects.js -->
<script src="projects.js"></script>
<script>
  var list = document.getElementById('plist');

  PROJECTS.forEach(function (p) {
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = 'project.html?id=' + encodeURIComponent(p.id);

    var cover = document.createElement('div');
    cover.className = 'cover';
    var img = document.createElement('img');
    img.src = p.cover;
    img.alt = '';
    img.loading = 'lazy';
    img.onerror = function () { img.remove(); }; /* couverture introuvable : bloc gris à la place */
    cover.appendChild(img);

    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = p.title;

    a.appendChild(cover);
    a.appendChild(name);
    li.appendChild(a);
    list.appendChild(li);
  });
</script>
</body>
</html>
